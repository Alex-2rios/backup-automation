name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Every tracked script has to be executable
        run: |
          missing=$(git ls-files --stage -- '*.sh' | awk '$1 != "100755" {print $4}')
          if [ -n "$missing" ]; then
            echo "these scripts are not executable in the index:" >&2
            echo "$missing" >&2
            echo "fix with: git update-index --chmod=+x <file>" >&2
            exit 1
          fi
          echo "all scripts are executable"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint every script
        run: shellcheck -e SC1090 bin/*.sh tests/*.sh

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run the suite
        run: ./tests/test_backup.sh

  systemd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the scripts where the units expect them
        run: sudo install -m 755 bin/backup.sh bin/verify.sh bin/restore.sh /usr/local/bin/

      - name: Validate the unit files
        run: systemd-analyze verify systemd/backup.service systemd/backup-verify.service
